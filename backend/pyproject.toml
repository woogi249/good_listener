[project]
name = "realtime-panel"
version = "0.1.0"
description = "OpenAI Realtime 기반 한국어 회의 접근성 코파일럿"
requires-python = ">=3.10"
dependencies = [
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "openai==3.3.1",
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pip-audit==2.10.1",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]
package = [
    "pyinstaller==6.21.0",
]

[project.scripts]
panel-realtime = "panel.realtime_app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["panel"]

[tool.setuptools.package-data]
panel = ["static/*"]
