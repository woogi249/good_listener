name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e backend
      - name: Compile
        run: python -m compileall -q backend/panel
      - name: Secret pattern check
        run: python scripts/check_no_secrets.py
      - name: Test
        run: python -m pytest -q backend/tests
      - name: Check dependency consistency
        run: python -m pip check
      - name: Audit locked dependencies
        run: python -m pip_audit -r backend/requirements.lock

  package-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps ./backend
      - name: Build portable Windows folder
        run: python -m PyInstaller --clean --noconfirm packaging/good-listener.spec
      - name: Generate dependency SBOM
        run: python -m pip_audit -r backend/requirements.lock --format cyclonedx-json --output dist/good-listener/good-listener-sbom.cdx.json
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist\good-listener\good-listener.exe")) {
            throw "good-listener.exe was not created"
          }
          if (-not (Test-Path -LiteralPath "dist\good-listener\good-listener-sbom.cdx.json")) {
            throw "dependency SBOM was not created"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: good-listener-windows-x64
          path: dist/good-listener/
          if-no-files-found: error

  # Live OpenAI calls are deliberately excluded from pull requests and pushes.
  # Run `scripts/verify.ps1 -LiveApi` only from an authorized operator machine.
